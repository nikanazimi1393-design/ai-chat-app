<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="dot"></div>
      <div>
        <div class="title">دستیار هوش مصنوعی</div>
        <div class="subtitle">مدل: {{ model }}</div>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <div id="preview" class="preview" style="display:none;">
      <img id="previewImg" src="" alt="preview">
      <button id="removeImg" type="button">✕</button>
    </div>

    <form id="form" class="inputbar">
      <input id="fileInput" type="file" accept="image/*" hidden>
      <button id="attachBtn" type="button" title="ارسال عکس">📷</button>
      <button id="micBtn" type="button" title="ورودی صوتی">🎤</button>
      <textarea id="input" placeholder="پیامت رو بنویس یا میکروفون رو بزن..." rows="1"></textarea>
      <button id="send" type="submit">ارسال</button>
    </form>
  </div>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');
const micBtn = document.getElementById('micBtn');
const previewBox = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const removeImgBtn = document.getElementById('removeImg');

let messages = [];
let pendingImage = null; // base64 data URL

function addBubble(role, text, imageDataUrl) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  if (imageDataUrl) {
    const img = document.createElement('img');
    img.src = imageDataUrl;
    img.className = 'bubble-img';
    div.appendChild(img);
  }
  if (text) {
    const span = document.createElement('div');
    span.textContent = text;
    span.style.whiteSpace = 'pre-wrap';
    div.appendChild(span);
  }
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

// ---------- Image attach ----------
attachBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // resize/compress to keep payload small
      const maxDim = 1024;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      pendingImage = canvas.toDataURL('image/jpeg', 0.7);
      previewImg.src = pendingImage;
      previewBox.style.display = 'flex';
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

removeImgBtn.addEventListener('click', () => {
  pendingImage = null;
  previewBox.style.display = 'none';
});

// ---------- Voice input ----------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'fa-IR';
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    input.value = (input.value ? input.value + ' ' : '') + transcript;
    input.dispatchEvent(new Event('input'));
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('active');
  };

  recognition.onerror = () => {
    listening = false;
    micBtn.classList.remove('active');
  };

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
      return;
    }
    listening = true;
    micBtn.classList.add('active');
    recognition.start();
  });
} else {
  micBtn.addEventListener('click', () => {
    alert('مرورگرت از ورودی صوتی پشتیبانی نمیکنه. از کروم استفاده کن.');
  });
}

// ---------- Send message ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && !pendingImage) return;

  let content;
  if (pendingImage) {
    content = [];
    if (text) content.push({ type: 'text', text: text });
    content.push({ type: 'image_url', image_url: { url: pendingImage } });
  } else {
    content = text;
  }

  messages.push({ role: 'user', content: content });
  addBubble('user', text, pendingImage);

  input.value = '';
  input.style.height = 'auto';
  pendingImage = null;
  previewBox.style.display = 'none';
  sendBtn.disabled = true;

  const assistantBubble = addBubble('assistant', '...');
  let assistantText = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    assistantBubble.textContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const payload = part.slice(6).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          if (json.error) {
            assistantBubble.textContent = 'خطا: ' + json.error;
            continue;
          }
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            assistantText += delta;
            assistantBubble.textContent = assistantText;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (err) {}
      }
    }

    messages.push({ role: 'assistant', content: assistantText });
  } catch (err) {
    assistantBubble.textContent = 'خطا در اتصال: ' + err.message;
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
