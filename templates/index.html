<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI Chat</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="dot"></div>
      <div>
        <div class="title">دستیار هوش مصنوعی</div>
        <div class="subtitle">مدل: {{ model }}</div>
      </div>
    </header>

    <main id="chat" class="chat"></main>

    <form id="form" class="inputbar">
      <textarea id="input" placeholder="پیامت رو بنویس..." rows="1"></textarea>
      <button id="send" type="submit">ارسال</button>
    </form>
  </div>

<script>
const chatEl = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

let messages = [];

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + role;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  messages.push({ role: 'user', content: text });
  addBubble('user', text);
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const assistantBubble = addBubble('assistant', '...');
  let assistantText = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    assistantBubble.textContent = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();

      for (const part of parts) {
        if (!part.startsWith('data: ')) continue;
        const payload = part.slice(6).trim();
        if (payload === '[DONE]') continue;
        try {
          const json = JSON.parse(payload);
          if (json.error) {
            assistantBubble.textContent = 'خطا: ' + json.error;
            continue;
          }
          const delta = json.choices?.[0]?.delta?.content;
          if (delta) {
            assistantText += delta;
            assistantBubble.textContent = assistantText;
            chatEl.scrollTop = chatEl.scrollHeight;
          }
        } catch (err) {}
      }
    }

    messages.push({ role: 'assistant', content: assistantText });
  } catch (err) {
    assistantBubble.textContent = 'خطا در اتصال: ' + err.message;
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
